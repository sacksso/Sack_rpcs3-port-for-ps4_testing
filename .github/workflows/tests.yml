name: Host tests

on:
  push:
    paths:
      - 'rpcs3-ps4/rpcs3/**'
      - 'rpcs3-ps4/ps4-port/**'
      - 'orbis-compat/**'
      - '.github/**'
  pull_request:
    paths:
      - 'rpcs3-ps4/rpcs3/**'
      - 'rpcs3-ps4/ps4-port/**'
      - 'orbis-compat/**'
      - '.github/**'
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Rutas largas en git
        shell: pwsh
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache de llvm-mingw
        id: llvm
        uses: actions/cache@v4
        with:
          path: C:\llvm-mingw
          key: llvm-mingw-20240619-ucrt-x86_64

      - name: Instalar llvm-mingw
        if: steps.llvm.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $zip = Join-Path $env:RUNNER_TEMP 'llvm-mingw.zip'
          Invoke-WebRequest 'https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-x86_64.zip' -OutFile $zip
          tar -xf $zip -C C:\
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Rename-Item C:\llvm-mingw-20240619-ucrt-x86_64 llvm-mingw

      - name: Compilar y ejecutar los tests
        shell: pwsh
        working-directory: rpcs3-ps4
        run: ./ps4-port/tools/run-host-tests.ps1 -Llvm C:\llvm-mingw\bin

      - name: Subir logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-tests-logs
          path: |
            rpcs3-ps4/ps4-port/.host-tests/*.log
            rpcs3-ps4/ps4-port/.host-tests/summary.md
          if-no-files-found: ignore
